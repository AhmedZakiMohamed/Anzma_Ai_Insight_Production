services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-anzma}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, on first start of an EMPTY volume, in filename order.
      - ../../db/init/anzma_schema_and_seed.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../db/migrations/003_incidents.sql:/docker-entrypoint-initdb.d/02-incidents.sql:ro
      - ../../db/migrations/004_chat_views.sql:/docker-entrypoint-initdb.d/03-chat-views.sql:ro
      - ../../db/migrations/005_alert_uniqueness.sql:/docker-entrypoint-initdb.d/04-alert-uniqueness.sql:ro
      - ../../db/migrations/006_ingestion_foundation.sql:/docker-entrypoint-initdb.d/05-ingestion-foundation.sql:ro
      - ../../db/migrations/007_event_source_identity.sql:/docker-entrypoint-initdb.d/06-event-source-identity.sql:ro
      - ../../db/migrations/008_ingestion_contract_conformance.sql:/docker-entrypoint-initdb.d/07-ingestion-contract-conformance.sql:ro
      - ../../db/migrations/009_freshness_expectations.sql:/docker-entrypoint-initdb.d/08-freshness-expectations.sql:ro
      - ../../db/migrations/010_data_gap_lifecycle.sql:/docker-entrypoint-initdb.d/09-data-gap-lifecycle.sql:ro
      - ../../db/migrations/011_source_liveness.sql:/docker-entrypoint-initdb.d/10-source-liveness.sql:ro
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-anzma}"]
      interval: 5s
      timeout: 5s
      retries: 10



  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_HOST_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 30s
      start_period: 30s
      retries: 10
    # NVIDIA GPU: uncomment if Docker has the NVIDIA container runtime
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]



  # One-shot: pulls the model into the ollama volume, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"



  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${API_PGDATABASE:-${PGDATABASE:-anzma}}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      ANZMA_API_TOKEN: ${ANZMA_API_TOKEN:-}
      ANZMA_AUTH_DISABLED: ${ANZMA_AUTH_DISABLED:-false}
      ANZMA_COOKIE_SECURE: ${ANZMA_COOKIE_SECURE:-false}
      ANZMA_INGEST_RATE_LIMIT_PER_MIN: ${ANZMA_INGEST_RATE_LIMIT_PER_MIN:-60}
      ANZMA_INGEST_RATE_LIMIT_BURST: ${ANZMA_INGEST_RATE_LIMIT_BURST:-10}
      ANZMA_CORS_ALLOWED_ORIGINS: ${ANZMA_CORS_ALLOWED_ORIGINS:-}
    # Only the DB is a hard dependency. The app falls back gracefully when
    # Ollama is down or the model is still downloading.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"


  # Opt-in, database-only evaluator; the API container does not own its lifecycle.
  freshness:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    profiles: ["freshness"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "scripts/freshness_job.py", "--loop"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${API_PGDATABASE:-${PGDATABASE:-anzma}}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      ANZMA_FRESHNESS_INTERVAL_SECONDS: ${ANZMA_FRESHNESS_INTERVAL_SECONDS:-60}
      ANZMA_FRESHNESS_LOCK_RETRY_SECONDS: ${ANZMA_FRESHNESS_LOCK_RETRY_SECONDS:-5}
      ANZMA_SOURCE_SILENCE_MULTIPLIER: ${ANZMA_SOURCE_SILENCE_MULTIPLIER:-3}
      ANZMA_MASS_STALE_MIN_SERIES: ${ANZMA_MASS_STALE_MIN_SERIES:-3}
      ANZMA_MASS_STALE_PERCENT: ${ANZMA_MASS_STALE_PERCENT:-50}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true



volumes:
  pgdata:
  ollama_models:
