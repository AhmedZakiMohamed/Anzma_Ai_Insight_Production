<text x="1133" y="281" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Local Core + cloud model</text>
<text x="1133" y="329" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Only minimized prompt egress</text>
<text x="1133" y="354" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Optional local fallback</text>
<g filter="url(#shadow)"><rect x="1115" y="485" width="400" height="150" rx="18" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/><path d="M1133 485 H1497 Q1515 485 1515 503 V543 H1115 V503 Q1115 485 1133 485" fill="#a35d7c"/></g>
