<rect width="1600" height="1000" fill="#f5f7fc"/>
<text x="52" y="58" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10234e">Architecture alternatives · deployment at a glance</text>
<text x="52" y="91" font-family="Arial,sans-serif" font-size="16" fill="#52627d">Choose by data policy, service ownership, isolation needs and measured AI workload—not by “enterprise” labels</text>
