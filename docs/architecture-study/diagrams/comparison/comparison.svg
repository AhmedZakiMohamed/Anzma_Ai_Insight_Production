<text x="103" y="281" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">One server</text>
<text x="103" y="329" font-family="Arial,sans-serif" font-size="14" fill="#17243b">API + DB + local AI</text>
<text x="103" y="354" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Compose, private service network</text>
<g filter="url(#shadow)"><rect x="85" y="485" width="400" height="150" rx="18" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/><path d="M103 485 H467 Q485 485 485 503 V543 H85 V503 Q85 485 103 485" fill="#198eaa"/></g>
<text x="103" y="521" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">One failure domain</text>
<text x="103" y="569" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Lowest installation burden</text>
<text x="103" y="594" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Contention must be benchmarked</text>
<g filter="url(#shadow)"><rect x="85" y="710" width="400" height="100" rx="18" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/><path d="M103 710 H467 Q485 710 485 728 V768 H85 V728 Q85 710 103 710" fill="#188b82"/></g>
