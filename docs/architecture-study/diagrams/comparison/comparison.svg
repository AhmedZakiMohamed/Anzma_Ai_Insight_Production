<text x="618" y="281" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Three service tiers</text>
<text x="618" y="329" font-family="Arial,sans-serif" font-size="14" fill="#17243b">App ↔ DB ↔ AI over private LAN</text>
<text x="618" y="354" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Independent sizing and maintenance</text>
<g filter="url(#shadow)"><rect x="600" y="485" width="400" height="150" rx="18" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/><path d="M618 485 H982 Q1000 485 1000 503 V543 H600 V503 Q600 485 618 485" fill="#198eaa"/></g>
<text x="618" y="521" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">More operations</text>
<text x="618" y="569" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Segmentation and monitoring</text>
<text x="618" y="594" font-family="Arial,sans-serif" font-size="14" fill="#17243b">HA is separate additional design</text>
<g filter="url(#shadow)"><rect x="600" y="710" width="400" height="100" rx="18" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/><path d="M618 710 H982 Q1000 710 1000 728 V768 H600 V728 Q600 710 618 710" fill="#188b82"/></g>
