<text x="585" y="182" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#52627d">B · SEPARATED TIERS</text>
<rect x="1080" y="150" width="470" height="710" rx="24" fill="#f2edff" fill-opacity=".34" stroke="#cdd7e8" stroke-width="2"/>
<text x="1100" y="182" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#52627d">C · APPROVED CLOUD AI</text>
