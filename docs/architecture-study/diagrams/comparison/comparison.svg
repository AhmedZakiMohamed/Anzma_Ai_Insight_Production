<text x="1133" y="594" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Egress policy and adapter needed</text>
<g filter="url(#shadow)"><rect x="1115" y="710" width="400" height="100" rx="18" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/><path d="M1133 710 H1497 Q1515 710 1515 728 V768 H1115 V728 Q1115 710 1133 710" fill="#188b82"/></g>
<text x="1133" y="746" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Best when approved</text>
<text x="1133" y="794" font-family="Arial,sans-serif" font-size="14" fill="#17243b">Managed inference / no GPU ops</text>
<text x="1550" y="976" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#52627d">ANZMA AI Insight · Architecture proposal · 25 Nov 2026</text>
